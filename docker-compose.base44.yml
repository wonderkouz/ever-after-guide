services:
  web:
    image: oven/bun:1.2-debian
    working_dir: /app
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
