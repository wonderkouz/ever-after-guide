# Base44 development environment for the Wedly / Ever After Guide app.
#
# Runs the project straight from the cloned source with the Vite dev server
# (live reload) on host port 3000, using the repo's own bun lockfile.
#
#   docker compose -f docker-compose.base44.yml up -d
#
# Notes:
# - The app is a TanStack Start (React SSR) app driven by Vite; `bun run dev`
#   starts `vite dev`, which compiles from source, so edits show up live.
# - Dependencies are installed at container startup because node_modules lives
#   on the bind-mounted source tree (never baked into the image).
# - Vite needs to accept the preview's external hostname; the platform supplies
#   __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS, which Vite >= 6.1 appends to
#   `server.allowedHosts`. It is passed through as a bare key on purpose.
# - BASE44_PREVIEW_MODE is passed through for sandbox-only overrides; it is
#   never hardcoded, so shared configuration keeps its normal behaviour when it
#   is unset.

services:
  web:
    image: oven/bun:1
    working_dir: /app
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bun run dev --host 0.0.0.0 --port 3000 --strictPort
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/'); process.exit(r.ok ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
